<?xml version="1.0" encoding="UTF-8"?>
<!-- Picket: three fence pickets, the middle one standing forward, cut to the outline of a shield. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ae6"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6f6"/>
    </linearGradient>
    <!-- the shield outline that trims the pickets at the bottom -->
    <clipPath id="shield">
      <path d="M22 14 H106 V64 C106 85 88 100 64 109 C40 100 22 85 22 64 Z"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#shield)">
    <!-- rail that ties the pickets together -->
    <rect x="27" y="58" width="74" height="11" fill="#ffffff" fill-opacity="0.5"/>
    <!-- outer pickets -->
    <path d="M27 40 L38 28 L49 40 V120 H27 Z" fill="url(#wood)"/>
    <path d="M79 40 L90 28 L101 40 V120 H79 Z" fill="url(#wood)"/>
    <!-- the middle picket stands taller: the forward post -->
    <path d="M53 32 L64 19 L75 32 V120 H53 Z" fill="url(#wood)"/>
    <!-- light from the left: the right half of each picket is slightly shaded -->
    <path d="M38 28 L49 40 V120 H38 Z M90 28 L101 40 V120 H90 Z M64 19 L75 32 V120 H64 Z" fill="#1a5fb4" fill-opacity="0.12"/>
  </g>
</svg>
